<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Open in Koala</title>
<link rel="icon" href="/apps/koala/icon.png">
<link rel="apple-touch-icon" href="/apps/koala/apple-touch-icon.png">
<!--
  A plan from an AI, in a Koala link: https://stanete.com/koala/add#v=1&by=Claude&...
  With Koala on the phone, the link opens Koala itself and this page never shows.
  When it shows, its button hands the plan to Koala. The plan is after #, so it stays in
  the browser: it is never sent to this site or anywhere else. Nothing here is tracked.
-->
<style>
  :root { color-scheme: light dark; --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; --sec: rgba(60,60,67,0.6); --btn: #000000; --onbtn: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --sec: rgba(235,235,245,0.6); --btn: #FFFFFF; --onbtn: #000000; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 26px; padding: 28px 20px 20px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; line-height: 28px; margin: 16px 0 6px; }
  p { margin: 0 0 20px; color: var(--sec); font-size: 15px; }
  .open { display: block; min-height: 52px; line-height: 52px; border-radius: 26px; background: var(--btn); color: var(--onbtn); font-weight: 600; text-decoration: none; }
  .get { display: block; margin-top: 14px; color: var(--sec); font-size: 15px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img src="/apps/koala/icon.png" alt="">
  <h1 id="title">Open the plan in Koala</h1>
  <p id="note">Koala shows you the plan before anything is added.</p>
  <a class="open" id="open" href="koala://add">Open in Koala</a>
  <a class="get" id="get" href="/koala/">Don’t have Koala? Get it free</a>
</main>
<script>
  (function () {
    var texts = {
      en: { title: "Open the plan in Koala", note: "Koala shows you the plan before anything is added.", open: "Open in Koala", get: "Don’t have Koala? Get it free", none: "This link has no plan in it. Ask your AI to write the Koala link again." },
      es: { title: "Abre el plan en Koala", note: "Koala te enseña el plan antes de añadir nada.", open: "Abrir en Koala", get: "¿No tienes Koala? Es gratis", none: "Este enlace no lleva ningún plan. Pide a tu IA que vuelva a escribir el enlace de Koala." },
      pt: { title: "Abra o plano no Koala", note: "O Koala mostra o plano antes de adicionar qualquer coisa.", open: "Abrir no Koala", get: "Não tem o Koala? É grátis", none: "Este link não traz nenhum plano. Peça à sua IA para escrever o link do Koala de novo." }
    };
    var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
    var t = texts[lang] || texts.en;
    var home = { en: "/koala/", es: "/koala/es/", pt: "/koala/pt/" }[lang] || "/koala/";
    document.documentElement.lang = texts[lang] ? lang : "en";
    var plan = location.hash.slice(1);
    // The plan only ever goes to Koala, on this phone.
    document.getElementById("open").href = "koala://add#" + plan;
    document.getElementById("open").textContent = t.open;
    document.getElementById("title").textContent = t.title;
    document.getElementById("note").textContent = plan ? t.note : t.none;
    document.getElementById("open").hidden = !plan;
    document.getElementById("get").textContent = t.get;
    document.getElementById("get").href = home;
  })();
</script>
</body>
</html>
